<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="NoFluxo UnB — a vida do estudante não é linear, cada um tem o seu próprio fluxo">
<style>
  text { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mote { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; }
  .sub { font-size: 18px; font-weight: 500; }
  .chip { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
  .cod { font-size: 10px; font-weight: 600; letter-spacing: .5px; }
  .nome { font-size: 11.5px; font-weight: 700; }
  .fio { fill: none; stroke-width: 2; stroke-dasharray: 6 10; opacity: .85; animation: flui 1.6s linear infinite; }
  .card { opacity: 0; animation: entra .6s ease-out forwards; }
  .brilho { animation: pulsa 6s ease-in-out infinite; }
  .cursor { animation: pisca 1.1s steps(1) infinite; }
  @keyframes flui { to { stroke-dashoffset: -32; } }
  @keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pulsa { 50% { opacity: .55; } }
  @keyframes pisca { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .fio, .brilho, .cursor { animation: none; }
    .card { animation: none; opacity: 1; }
    .ponto { display: none; }
  }
</style>
<defs>
  <radialGradient id="g" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 180) scale(420 260)">
    <stop offset="0" stop-color="#6c38e5" stop-opacity=".22"/>
    <stop offset="1" stop-color="#6c38e5" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1280" height="360" rx="24" fill="#f9f6fe"/>
<rect class="brilho" width="1280" height="360" rx="24" fill="url(#g)"/>
<image href="data:image/png;base64," x="56" y="44" width="320" height="96"/>
<g transform="translate(72 168)">
  <text class="mote" fill="#171320">A vida do estudante não é linear.</text>
  <text class="mote" y="44" fill="#171320">Cada um tem o seu próprio <tspan fill="#6c38e5">fluxo</tspan><tspan class="cursor" fill="#6c38e5">_</tspan></text>
  <text class="sub" y="92" fill="#5f5970">Fluxograma interativo da UnB · histórico do SIGAA · assistente de IA Darcy</text>
</g>
<path class="fio" d="M900,96 C923,96 923,96 946,96" stroke="#059669" style="animation-delay:0.00s"/>
<path class="fio" d="M900,182 C923,182 923,182 946,182" stroke="#7c3aed" style="animation-delay:0.35s"/>
<path class="fio" d="M900,182 C1016,182 1016,182 1132,182" stroke="#d97706" style="animation-delay:0.70s"/>
<path class="fio" d="M1086,96 C1109,96 1109,96 1132,96" stroke="#dc2626" style="animation-delay:1.05s"/>
<path class="fio" d="M1086,182 C1109,182 1109,182 1132,182" stroke="#059669" style="animation-delay:1.40s"/>
<path class="fio" d="M1086,268 C1109,268 1109,268 1132,268" stroke="#7c3aed" style="animation-delay:1.75s"/>
<path class="fio" d="M900,268 C923,268 923,268 946,268" stroke="#d97706" style="animation-delay:2.10s"/>
<path class="fio" d="M1086,182 C1109,182 1109,268 1132,268" stroke="#dc2626" style="animation-delay:2.45s"/>
<circle r="4" fill="#6c38e5" class="ponto"><animateMotion dur="3.2s" repeatCount="indefinite" begin="0.0s" path="M900,182 C923,182 923,182 946,182"/></circle>
<circle r="4" fill="#6c38e5" class="ponto"><animateMotion dur="3.6s" repeatCount="indefinite" begin="0.8s" path="M1086,182 C1109,182 1109,182 1132,182"/></circle>
<circle r="4" fill="#6c38e5" class="ponto"><animateMotion dur="4.0s" repeatCount="indefinite" begin="1.6s" path="M900,96 C923,96 923,96 946,96"/></circle>
<circle r="4" fill="#6c38e5" class="ponto"><animateMotion dur="4.4s" repeatCount="indefinite" begin="2.4s" path="M1086,268 C1109,268 1109,268 1132,268"/></circle>
