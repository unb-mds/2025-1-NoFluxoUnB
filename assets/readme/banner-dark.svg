g><g class="card" style="animation-delay:0.72s"><rect x="1132" y="70" width="140" height="52" rx="10" fill="#15121b" stroke="#2b2536"/><rect x="1132" y="78" width="4" height="36" rx="2" fill="#f97316"/><text x="1146" y="92" class="cod" fill="#a59fb2">FGA0160</text><text x="1146" y="110" class="nome" fill="#e9e6ef">MÉTODOS NUM.</text></g><g class="card" style="animation-delay:0.84s"><rect x="1132" y="156" width="140" height="52" rx="10" fill="#15121b" stroke="#2b2536"/><rect x="1132" y="164" width="4" height="36" rx="2" fill="#f97316"/><text x="1146" y="178" class="cod" fill="#a59fb2">FGA0030</text><text x="1146" y="196" class="nome" fill="#e9e6ef">ESTR. DADOS 2</text></g><g class="card" style="animation-delay:0.96s"><rect x="1132" y="242" width="140" height="52" rx="10" fill="#15121b" stroke="#2b2536"/><rect x="1132" y="250" width="4" height="36" rx="2" fill="#6b7280"/><text x="1146" y="264" class="cod" fill="#a59fb2">FGA0003</text><text x="1146" y="282" class="nome" fill="#e9e6ef">COMPILADORES</text></g>
</svg>
