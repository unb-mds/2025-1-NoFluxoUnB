name: Security and Code Quality

# Desenho de eficiência:
# - Em PR roda só o que BLOQUEIA de verdade: npm audit (deps de produção) e o
#   check estrito de TypeScript. Rápido (~1 min) e sem passos "|| true".
# - Os relatórios informativos (safety, bandit, mypy, isort, deps desatualizadas)
#   não bloqueiam ninguém — rodam só no agendamento semanal e viram artifacts.
# - concurrency cancela runs obsoletos; caches cortam a instalação.

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  schedule:
    # Executa semanalmente às 2h da manhã de domingo
    - cron: '0 2 * * 0'

permissions:
  contents: read

concurrency:
  group: seguranca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install Node.js dependencies
      working-directory: backend
      run: npm ci

    - name: Run npm audit
      working-directory: backend
      # Audita apenas dependências de produção (--omit=dev): vulnerabilidades
      # em ferramentas de desenvolvimento (ex.: @typescript-eslint) não vão
      # para o bundle final. As deps de produção devem ficar sem vulns.
      run: npm audit --audit-level=moderate --omit=dev

    # Frontend (pré-mortem 27/09/2026, R56): antes nenhum workflow auditava
    # frontend/. O npm audit lê só o package-lock.json, dispensa npm ci.
    # --audit-level=high: o frontend é SPA estática (nginx), boa parte das
    # advisories de vite/rollup/postcss só afeta o build/dev-server.
    - name: Run npm audit (frontend)
      working-directory: frontend
      # TODO(R56): em 28/09/2026 o audit acusa 8 vulns high (@sveltejs/kit,
      # devalue, cookie, nanoid, picomatch, postcss, rollup, vite, ws), todas
      # com fix via `npm audit fix`, mas ele sobe kit/svelte/vite e precisa de
      # vitest + build + teste manual. Depois desse upgrade (e de decidir entre
      # package-lock e pnpm-lock, que o Dockerfile usa), remover esta linha
      # para o step voltar a bloquear.
      continue-on-error: true
      run: npm audit --audit-level=high --omit=dev

    # ── Relatórios informativos: só no agendamento semanal ──────────────────
    - name: Setup Python
      if: github.event_name == 'schedule'
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: DBA/tests/requirements.txt

    - name: Install Python security tools
      if: github.event_name == 'schedule'
      run: |
        python -m pip install --upgrade pip
        pip install -r DBA/tests/requirements.txt
        pip install bandit safety

    - name: Run safety check for Python
      if: github.event_name == 'schedule'
      run: safety check --json --output safety-report.json || true

    - name: Run bandit security scan
      if: github.event_name == 'schedule'
      run: bandit -r DBA/tests/ -f json -o bandit-report.json || true

    - name: Upload security reports
      if: github.event_name == 'schedule'
      uses: actions/upload-artifact@v6
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.json

  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      working-directory: backend
      run: npm ci

    - name: Run TypeScript strict check
      working-directory: backend
      run: npx tsc --noEmit --strict --noImplicitAny --noImplicitReturns --noUnusedLocals --noUnusedParameters

    # ── Relatórios informativos: só no agendamento semanal ──────────────────
    - name: Run ESLint with detailed output
      if: github.event_name == 'schedule'
      working-directory: backend
      run: npm run lint -- --format=json --output-file=eslint-report.json || true

    - name: Setup Python
      if: github.event_name == 'schedule'
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Python linting reports (flake8 + black + isort + mypy)
      if: github.event_name == 'schedule'
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy
        flake8 DBA/tests/ --format=json --output-file=flake8-report.json || true
        black --check --diff DBA/tests/ || true
        isort --check-only --diff DBA/tests/ || true
        mypy DBA/tests/ --json-report mypy-report.json || true

    - name: Upload quality reports
      if: github.event_name == 'schedule'
      uses: actions/upload-artifact@v6
      with:
        name: quality-reports
        path: |
          backend/eslint-report.json
          flake8-report.json
          mypy-report.json

  # Inventário de dependências desatualizadas: não bloqueia ninguém e muda
  # devagar — rodar a cada PR era só custo. Semanal cobre a necessidade.
  dependency-updates:
    runs-on: ubuntu-latest
    name: Dependency Updates Check
    timeout-minutes: 15
    if: github.event_name == 'schedule'

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'

    - name: Check for outdated npm packages
      working-directory: backend
      run: npm outdated --json > npm-outdated.json || echo '{}' > npm-outdated.json

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Check for outdated Python packages
      run: |
        pip install pip-review
        pip-review --format=json > pip-outdated.json || echo '{}' > pip-outdated.json

    - name: Upload dependency reports
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: dependency-reports
        path: |
          backend/npm-outdated.json
          pip-outdated.json

  quality-summary:
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality]
    if: github.event_name == 'schedule'
    name: Quality Summary

    steps:
    - name: Download all reports
      uses: actions/download-artifact@v7
      with:
        path: reports

    - name: Generate quality summary
      run: |
        echo "## Security and Code Quality Summary" >> $GITHUB_STEP_SUMMARY
        echo "### Security Scan" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Security scan completed" >> $GITHUB_STEP_SUMMARY
        echo "### Code Quality" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Code quality checks completed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📊 Detailed reports available in the Actions artifacts" >> $GITHUB_STEP_SUMMARY
