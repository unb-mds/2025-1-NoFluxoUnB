name: Deploy

# Só publica o que passou no CI (pré-mortem 27/09/2026, R23). Antes o deploy
# disparava no push da main em paralelo com o CI e publicava mesmo com teste
# vermelho. Agora ele espera o workflow "CI" (pipelineCI.yml) terminar na main
# e o job só roda se a conclusão for success; run cancelado (push mais novo
# em cima, concurrency do CI) não publica — o run do push seguinte publica.
# Hotfix urgente continua possível pelo workflow_dispatch, que não tem gate.
# Atenção: workflow_run sempre usa a versão deste arquivo na branch default.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - backend
          - frontend
          - mcp-agent

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # event == 'push' e head_repository: `branches: [main]` também casa com um
    # PR de fork cuja branch se chama main — sem isso, código de fora rodaria
    # aqui com os segredos de produção.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      # Publica exatamente o commit que passou no CI (no workflow_run o
      # github.sha é o HEAD atual da main, que pode já ser outro commit).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests python-dotenv

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (multi-arch support)
        uses: docker/setup-qemu-action@v3

      - name: Log in to private registry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 2
          max_attempts: 5
          retry_wait_seconds: 10
          command: |
            echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.kubernetes.crianex.com \
              --username "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Deploy
        env:
          DEPLOY_API_URL: ${{ secrets.DEPLOY_API_URL }}
          DEPLOY_API_KEY: ${{ secrets.DEPLOY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MCP_AGENT_API_KEY: ${{ secrets.MCP_AGENT_API_KEY }}
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RAGFLOW_API_KEY: ${{ secrets.RAGFLOW_API_KEY }}
          RAGFLOW_BASE_URL: ${{ secrets.RAGFLOW_URL }}
          RAGFLOW_AGENT_ID: ${{ secrets.RAGFLOW_AGENT_ID }}
          MARITACA_API_KEY: ${{ secrets.MARITACA_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          TARGET="${{ github.event.inputs.target || 'all' }}"
          python scripts/deploy/deploy_local.py "$TARGET" \
            --platform linux/amd64 \
            --wait \
            --stream-logs
