name: Fast Sync Turmas

on:
  workflow_dispatch:
  workflow_run:
    # Cauda da cadeia mensal ementa -> equivalencias -> turmas (roda incondicionalmente).
    workflows: ["Scrape Equivalencias"]
    types: [completed]
  schedule:
    # Cadência decidida pela RPC scraping_turmas_decisao, que cruza a fase do
    # calendário acadêmico com o modo configurado no admin. Ver jobDecisao.
    # Era */15, mas a rodada completa (207 deptos, com sleeps anti-ban) não cabe
    # em 15 min — as execuções se sobrepunham.
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: fast-sync-turmas
  cancel-in-progress: false

jobs:
  jobDecisao:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      ano_periodo: ${{ steps.check.outputs.ano_periodo }}
      # JSON com os períodos desta rodada: o vigente e, uma vez por mês, o próximo.
      periodos: ${{ steps.check.outputs.periodos }}
    steps:
      - name: Decidir se esta rodada scrapeia, e de quais períodos
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # ------------------------------------------------------------------
          # 1. Período e cadência, direto do banco (calendário + modo).
          #    Toda a regra de negócio mora na RPC; aqui só se lê o resultado.
          # ------------------------------------------------------------------
          RESPONSE=$(curl -sf -X POST \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$SUPABASE_URL/rest/v1/rpc/scraping_turmas_decisao" || echo "")

          # Fail-safe: sem resposta utilizável, o fallback é "diaria" — o gate
          # antigo caía em 'false' e zerava a coleta sempre que o curl falhava.
          PARSED=$(echo "$RESPONSE" | python3 -c "import sys,json;d=json.load(sys.stdin);r=d[0] if isinstance(d,list) else d;print(r.get('periodo') or '',r.get('cadencia') or 'diaria',r.get('fase') or '?',r.get('modo') or '?',r.get('ativo_ate') or '-',r.get('data_fim') or '-')" 2>/dev/null || echo " diaria ? ? - -")

          ANO_PERIODO=$(echo "$PARSED" | cut -d' ' -f1)
          CADENCIA=$(echo "$PARSED" | cut -d' ' -f2)
          FASE=$(echo "$PARSED" | cut -d' ' -f3)
          MODO=$(echo "$PARSED" | cut -d' ' -f4)
          ATIVO_ATE=$(echo "$PARSED" | cut -d' ' -f5)
          DATA_FIM=$(echo "$PARSED" | cut -d' ' -f6)

          # Último recurso: a RPC não respondeu e ninguém sabe o período.
          if [ -z "$ANO_PERIODO" ]; then
            ANO_PERIODO=$(python3 -c "import datetime;h=datetime.date.today();print(f'{h.year}.{\"1\" if h.month<=6 else \"2\"}')")
            echo "::warning::RPC scraping_turmas_decisao indisponível — caindo na fórmula por mês ($ANO_PERIODO). O período pode estar errado no fim do semestre."
          fi

          # ------------------------------------------------------------------
          # 2. Próximo período: o primeiro do calendário que começa depois do fim
          #    do vigente (assim um eventual período de verão não confunde). Sem
          #    calendário, a fórmula: AAAA.1 -> AAAA.2 -> (AAAA+1).1.
          # ------------------------------------------------------------------
          PROXIMO=""
          if [ "$DATA_FIM" != "-" ]; then
            PROXIMO=$(curl -sf \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              "$SUPABASE_URL/rest/v1/calendario_academico?select=periodo&data_inicio=gt.$DATA_FIM&order=data_inicio.asc&limit=1" \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print(d[0]['periodo'] if d else '')" 2>/dev/null || echo "")
          fi
          if [ -z "$PROXIMO" ]; then
            PROXIMO=$(python3 -c "a,p='$ANO_PERIODO'.split('.');print(f'{a}.2' if p=='1' else f'{int(a)+1}.1')")
            echo "Próximo período pela fórmula (calendário não o tinha): $PROXIMO"
          fi

          echo "periodo=$ANO_PERIODO | proximo=$PROXIMO | cadencia=$CADENCIA | fase=$FASE | modo=$MODO | ativo_ate=$ATIVO_ATE"
          echo "ano_periodo=$ANO_PERIODO" >> "$GITHUB_OUTPUT"

          # ------------------------------------------------------------------
          # 3. A cadência só governa o cron. Disparo manual e a cadeia mensal
          #    passam por cima dela — inclusive com modo=off, que é um botão de
          #    cadência, não um freio do pipeline inteiro.
          #    O próximo período vai junto só na rodada mensal (cadeia do dia 1:
          #    ementa -> equivalencias -> turmas) e no disparo manual — nunca no
          #    cron. A oferta dele muda devagar e cada período é mais uma rodada
          #    inteira de 207 departamentos no SIGAA. Quem precisar dela antes
          #    (oferta acabou de sair) dispara o workflow à mão.
          # ------------------------------------------------------------------
          ENABLED=false
          COM_PROXIMO=false
          HORA=$(date -u +%H)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Disparo manual — rodando incondicionalmente."
            ENABLED=true
            COM_PROXIMO=true
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
              echo "Rodada mensal de base (após Scrape Equivalencias) — rodando incondicionalmente."
              ENABLED=true
              COM_PROXIMO=true
            else
              echo "Scrape Equivalencias não teve sucesso — pulando rodada de base."
            fi
          else
            # Cron: rapida = toda rodada; diaria = só às 03h UTC; nenhuma = nunca.
            case "$CADENCIA" in
              rapida)
                echo "Cadência rápida (fase=$FASE, modo=$MODO) — rodando."
                ENABLED=true
                ;;
              diaria)
                if [ "$HORA" = "03" ]; then
                  echo "Cadência diária (fase=$FASE) e são 03h UTC — rodando."
                  ENABLED=true
                else
                  echo "Cadência diária (fase=$FASE) e são ${HORA}h UTC — pulando."
                fi
                ;;
              *)
                echo "Cadência '$CADENCIA' (fase=$FASE, modo=$MODO) — não roda no cron."
                ;;
            esac
          fi

          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          if [ "$COM_PROXIMO" = "true" ] && [ "$PROXIMO" != "$ANO_PERIODO" ]; then
            echo "Esta rodada coleta também o próximo período ($PROXIMO)."
            echo "periodos=[\"$ANO_PERIODO\",\"$PROXIMO\"]" >> "$GITHUB_OUTPUT"
          else
            echo "periodos=[\"$ANO_PERIODO\"]" >> "$GITHUB_OUTPUT"
          fi

  jobSyncTurmas:
    needs: jobDecisao
    if: needs.jobDecisao.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Um período por vez (anti-ban no SIGAA), e a falha de um não cancela o
      # outro: o vigente é o que importa, o próximo é bônus.
      max-parallel: 1
      fail-fast: false
      matrix:
        ano_periodo: ${{ fromJSON(needs.jobDecisao.outputs.periodos) }}
    env:
      PYTHONUNBUFFERED: "1"
      ANO_PERIODO: ${{ matrix.ano_periodo }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install wheel Cython
          pip install --no-build-isolation -r DBA/scraping/requirements.txt

      - name: Create required data directories
        run: |
          mkdir -p DBA/turmas
          mkdir -p DBA/logs

      - name: Compute run_started_at
        id: vars
        run: |
          echo "run_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Período alvo desta rodada: $ANO_PERIODO"

      - name: 1. Extract Turmas (Scraping)
        working-directory: DBA/scraping
        run: |
          set -o pipefail
          # O período vem do calendário (jobDecisao), não da fórmula por mês que
          # o scraper usaria sozinho. Cada turma ainda grava o ano_periodo lido
          # do HTML do SIGAA — estes flags só definem o que é PESQUISADO.
          ANO="${ANO_PERIODO%.*}"
          PER="${ANO_PERIODO#*.}"
          python -u scraping_turmas.py --ano "$ANO" --periodo "$PER" 2>&1 | tee ../logs/scraping_turmas.log

      - name: 2. Insert Turmas (Supabase)
        working-directory: DBA/database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} # Fallback
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} # Fallback
        run: |
          set -o pipefail
          python -u 03_insert_turmas.py 2>&1 | tee ../logs/03_insert_turmas.log

      - name: 3. Reconcile Turmas (delete stale, same period)
        working-directory: DBA/database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} # Fallback
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} # Fallback
          RUN_STARTED_AT: ${{ steps.vars.outputs.run_started_at }}
        run: |
          set -o pipefail
          # Período sem nenhuma turma coletada nesta rodada (oferta do próximo
          # semestre ainda não publicada) não é reconciliado — ver o script.
          python -u 04_reconciliar_turmas.py --ano-periodo "$ANO_PERIODO" 2>&1 | tee ../logs/04_reconciliar_turmas.log

      - name: Upload Logs (Para auditoria)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-sync-turmas-${{ matrix.ano_periodo }}
          # Só o log do scraping (sem segredos); os logs dos scripts de banco
          # rodam com service_role e não devem virar artifact.
          path: DBA/logs/scraping_turmas.log
          if-no-files-found: ignore
